[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-cicd"
version = "0.1.0"
description = "AI-powered CI/CD pipeline generator from natural language prompts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Zarak" }
]
keywords = ["cicd", "devops", "ai", "openai", "docker", "github-actions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
prompt-cicd = "prompt_cicd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_cicd"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
